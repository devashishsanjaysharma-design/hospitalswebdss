        body {
            margin: 0;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* पेज की पूरी ऊंचाई ले */
        }

        main {

            padding: 20px;

            color: black;
            /* हल्का टेक्स्ट रंग */

            /* ऊपर/नीचे और दाएं/बाएं पैडिंग */
            font-size: 1rem;
            /* डिफ़ॉल्ट फ़ॉन्ट साइज़ */
        }

        .footer-container {
            max-width: 1200px;

            margin: 0 auto;
            /* कंटेनर को बीच में करें */
            display: flex;
            /* फ़्लेक्सबॉक्स लेआउट सक्षम करें */
            flex-wrap: wrap;
            /* अगर जगह कम हो तो आइटम अगली लाइन में आ जाएं */
            justify-content: space-between;
            /* आइटम्स के बीच स्पेस दें */
            gap: 30px;
            /* आइटम्स के बीच गैप */
        }

        .footer-section {
            flex: 9;
            /* प्रत्येक सेक्शन को बराबर जगह लेने दें */

            /* मोबाइल पर स्टैक्ड होने पर नीचे मार्जिन */
        }

        .footer-section h2 {
            color: #3498db;
            /* शीर्षक का रंग */
            margin-bottom: 20px;
            /* शीर्षक के नीचे मार्जिन */
            font-size: 1.3rem;
            /* शीर्षक का फ़ॉन्ट साइज़ */
            position: relative;
            /* अंडरलाइन इफ़ेक्ट के लिए */
        }

        /* शीर्षक के नीचे सरल अंडरलाइन */
        .footer-section h2::after {
            content: '';
            display: block;
            width: 50px;
            /* अंडरलाइन की चौड़ाई */
            height: 3px;
            /* अंडरline की ऊंचाई */
            background-color: #3498db;
            /* अंडरलाइन का रंग */
            margin-top: 10px;
        }


        .footer-section p {
            margin-bottom: 10px;
            /* पैराग्राफ़ के नीचे मार्जिन */
            line-height: 1.8;
            /* लाइन स्पेसिंग */
        }

        .footer-section ul {
            list-style: none;
            /* लिस्ट स्टाइल हटाएँ */
            padding: 0;
            /* डिफ़ॉल्ट पैडिंग हटाएँ */
            margin: 0;
            /* डिफ़ॉल्ट मार्जिन हटाएँ */
        }

        .footer-section ul li {
            margin-bottom: 10px;
            /* लिस्ट आइटम के नीचे मार्gin */
        }

        .footer-section ul li a {
            color: black;
            /* लिंक का रंग */
            text-decoration: none;
            /* अंडरलाइन हटाएँ */
            transition: color 0.3s ease;
            /* होवर पर स्मूथ ट्रांजिशन */
        }

        .footer-section a:hover {
            color: #34495e;
            /* होवर पर लिंक का रंग बदलें */
        }

        /* सोशल मीडिया लिंक स्टाइल */
        .social-links a {

        }

        .footer-section.contact img {

        }

            margin-top: 30px;
            /* कॉपीराइट सेक्शन के ऊपर मार्जिन */

            color: black;

        }

        @media (max-width: 768px) {

        /* style.css फ़ाइल में मौजूदा स्टाइल के साथ जोड़ें */

        /* ऐप लिंक सेक्शन के लिए स्टाइल (मौजूदा footer-section स्टाइल जैसा) */

.icon-row {
    display: flex;
    justify-content: space-around;
    /* Distribute icons evenly */
   
}

.icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.icon-item img {
    
    display: flex;
   
    justify-content: space-around;
    /* Distribute icons evenly */
    width: 35%;
    /* Adjust width as needed */
    margin-bottom: 20px;
    padding: 10px;
    
}

.icon-item span {
    font-size: 14px;
    /* Adjust text size */
    color: #333;
    /* Adjust text color */
    text-align: center;
}

.container {
    display: flex;
    /* Enable flex container */
    justify-content: space-around;
    /* Distribute boxes evenly */
    width: 80%;
    /* Adjust container width as needed */
    margin: 0 auto;
    /* Center the container */
    padding: 20px;
    /* Optional padding for the container */
    background-color: #f0f0f0;
    /* Optional background for the container */
}

.box {
    border: 1px solid #ccc;
    /* Border for each box */
    padding: 15px;
    /* Padding inside each box */
    margin: 10px;
    /* Margin around each box */
    text-align: center;
    /* Center content within each box */
    flex: 1;
