<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>  
    .floating-widget-container {
            position: fixed;
            right: 0;
            top: 25%;
            display: flex;
            align-items: flex-start;
            z-index: 1000;
            font-family: sans-serif;
        }

        .widget-tabs {
            display: flex;
            flex-direction: column;
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.15);
        }

        .tab-icons-strip {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 15px 8px;
            border-top-left-radius: 4px;
        }

        .tab-icons-strip i {
            font-size: 18px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .tab-icons-strip i:hover {
            opacity: 0.8;
        }

        .tab-label-red {
             background: #c47a00;
            color: #ffffff;
            padding: 14px 5px;
          
            font-weight: bold;
            font-size: 18px;
            
            cursor: pointer;
            border-bottom-left-radius: 1px;
            border-top-left-radius: 1px;
           
        }
        .enquiry-form-popup {
               background: #c47a00;
             color: #ffffff;
             color: white;

    border: none;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
          border-bottom-left-radius: 4px;
            border-top-left-radius: 4px;
            /* box-shadow: -5px 5px 25px rgba(0, 0, 0, 0.25); */
            width: 64px; 
           padding: 1px 1.5px;
          
            text-align: center;
           
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s;
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            right: 48px;
            top: 0;
        }

.translate {
    position: fixed;

    bottom: 0;
    left: 20px;

    width: 125px;
    height: 40px;

    background: #c47a00;

    color: white;

    border: none;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    z-index: 2000;

    transition: 0.3s;
}
        .floating-widget-container.active .enquiry-form-popup {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
            position: relative;
            right: 0;
        }

       

      
</style>
</head>
<body>
      <div class="floating-widget-container" id="floatingWidget">
        <div class="enquiry-form-popup">
          
            <p class="p" >Translate</p>
        </div>
        <div class="widget-tabs" id="widgetToggle">
          
            <div class="tab-label-red">➤</div>
        </div>
    </div>

<script>
    
    const floatingWidget = document.getElementById('floatingWidget');
    const widgetToggle = document.getElementById('widgetToggle');

    widgetToggle.addEventListener('click', () => {
        floatingWidget.classList.toggle('active');
        
    });
</script>
</body>
</html>
