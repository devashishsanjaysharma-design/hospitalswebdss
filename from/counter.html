<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Counter Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid #ddd;
    }

    h1 {
      color: #6e0000;
      font-size: 24px;
    }

    .status-badge {
      background-color: #28a745;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background-color: #006699;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background-color: #f9f9f9;
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .time-cell {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hospital Staff - Live Counter Portal</h1>
      <span class="status-badge">● Live Syncing</span>
    </header>

    <table>
      <thead>
        <tr>
          <th>Time (Local)</th>
          <th>Patient Name</th>
          <th>Age / Gender</th>
          <th>Mobile</th>
          <th>Preferred Date & Time</th>
          <th>Medical History</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="enquiryTableBody">
        <tr>
          <td colspan="7" class="empty-msg">Waiting for appointment entries...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDQB2Gds2s2O_1qgSgTrCz7EPiEyQAsHCY",
      authDomain: "hospital-portal-52731.firebaseapp.com",
      projectId: "hospital-portal-52731",
      storageBucket: "hospital-portal-52731.firebasestorage.app",
      messagingSenderId: "107231037078",
      appId: "1:107231037078:web:e544f3d8b73fccf2b924b7",
      measurementId: "G-53VZXC518R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tableBody = document.getElementById('enquiryTableBody');

    // Query enquiries ordered by submission time (newest first)
    const q = query(collection(db, "enquiries"), orderBy("createdAt", "desc"));

    // Real-time listener using onSnapshot
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        tableBody.innerHTML = `<tr><td colspan="7" class="empty-msg">No appointments booked yet.</td></tr>`;
        return;
      }

      tableBody.innerHTML = "";

      snapshot.forEach((doc) => {
        const data = doc.data();
        
        // Convert Firestore UTC ServerTimestamp to user's local time string
        const formattedTime = data.createdAt 
          ? new Date(data.createdAt.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
          : "Just now";

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="time-cell">${formattedTime}</td>
          <td><strong>${data.fullName}</strong></td>
          <td>${data.age} / ${data.gender}</td>
          <td>${data.mobile}</td>
          <td>${data.preferredDateTime ? data.preferredDateTime.replace("T", " ") : "N/A"}</td>
          <td>${data.medicalHistory || "None"}</td>
          <td><span style="color: #d9534f; font-weight: bold;">${data.status || 'Pending'}</span></td>
        `;
        tableBody.appendChild(row);
      });
    }, (error) => {
      console.error("Real-time listener error: ", error);
    });
  </script>

</body>
</html>
