<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Booking Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .form-container {
      width: 100%;
      max-width: 900px;
      border: 5px solid #6e0000;
      padding: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #555555;
      margin-bottom: 8px;
    }

    .form-group input, .select {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background-color: #f5f5f5;
      border: 1px solid #e2e2e2;
      border-radius: 2px;
      font-size: 15px;
      color: #333333;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-group input:focus, .select:focus {
      background-color: #ffffff;
      border-color: #006699;
    }

    .submit-btn {
      margin-top: 30px;
      background-color: #006699;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover {
      background-color: #004d73;
    }

    .submit-btn:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <form id="appointmentForm">
      <div class="form-grid">
        
        <!-- Full Name -->
        <div class="form-group full-width">
          <label for="fullName">Full Name (required)</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>

        <!-- Age -->
        <div class="form-group">
          <label for="age">Age (required)</label>
          <input type="number" id="age" name="age" required>
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label for="gender">Gender (required)</label>
          <select id="gender" name="gender" required class="select">
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <!-- Mobile -->
        <div class="form-group">
          <label for="mobile">Mobile (required)</label>
          <input type="tel" id="mobile" name="mobile" required>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email (Optional)</label>
          <input type="email" id="email" name="email">
        </div>

        <!-- Brief Medical History -->
        <div class="form-group">
          <label for="medicalHistory">Brief Medical History</label>
          <input type="text" id="medicalHistory" name="medicalHistory">
        </div>

        <!-- Preferred Date and Time -->
        <div class="form-group">
          <label for="dateTime">Preferred Date and Time (required)</label>
          <input type="datetime-local" id="dateTime" name="dateTime" required>
        </div>

      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">BOOK AN APPOINTMENT</button>
    </form>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // आपकी प्रोजेक्ट कॉन्फ़िगरेशन
    const firebaseConfig = {
      apiKey: "AIzaSyDQB2Gds2s2O_1qgSgTrCz7EPiEyQAsHCY",
      authDomain: "hospital-portal-52731.firebaseapp.com",
      projectId: "hospital-portal-52731",
      storageBucket: "hospital-portal-52731.firebasestorage.app",
      messagingSenderId: "107231037078",
      appId: "1:107231037078:web:e544f3d8b73fccf2b924b7",
      measurementId: "G-53VZXC518R"
    };

    // Firebase Initialize करना
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const appointmentForm = document.getElementById('appointmentForm');
    const submitBtn = document.getElementById('submitBtn');

    appointmentForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "SUBMITTING...";

      const formData = {
        fullName: document.getElementById('fullName').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        mobile: document.getElementById('mobile').value,
        email: document.getElementById('email').value || "",
        medicalHistory: document.getElementById('medicalHistory').value || "",
        preferredDateTime: document.getElementById('dateTime').value,
        status: "Pending",
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "enquiries"), formData);
        alert("Thank you! Your appointment request has been submitted successfully.");
        appointmentForm.reset();
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("Submission failed. Check console for details.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "BOOK AN APPOINTMENT";
      }
    });
  </script>

</body>
</html>
